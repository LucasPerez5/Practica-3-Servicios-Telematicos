<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería Meteorológica - Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
    
    <!-- Importamos la librería jQuery obligatoria para la práctica -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <main>
        <header>  
            <h1>Galería de Estaciones</h1>
        </header>

        <section class="seccion-centrada">
            <h2>Imágenes de las ciudades en distintas estaciones</h2>
            
            <div class="carrusel-wrapper">
                <button class="flecha" id="btn-izq">&#10094;</button> 
                
                <div class="carrusel-contenedor" id="carrusel">
                    <img src="alcala.jpg" alt="UAH - Politecnico">
                    <img src="serracines.jpg" alt="Serracines">
                    <img src="coslada.jpg" alt="Coslada">
                    <img src="madrid.jpg" alt="Madrid - Centro">
                    <img src="torrejon.jpg" alt="Torrejón de Ardoz">
                    <img src="guadalajara.jpg" alt="Guadalajara">
                </div>
                
                <button class="flecha" id="btn-der">&#10095;</button> 
            </div>
            
            <div id="info-imagen"></div>
        </section>

        <footer>
            <a href="index.html">Volver a la página principal</a>
            <br><br>
            Universidad de Alcalá
        </footer>
    </main>

    <script>
        $(document).ready(function() {
            $('.carrusel-contenedor img').hover(
                function(e) {
                    var texto = $(this).attr('alt');
                    $('#info-imagen').text(texto).css({
                        top: e.pageY + 15 + 'px',
                        left: e.pageX + 15 + 'px'
                    }).fadeIn('fast');
                }, 
                function() {
                    $('#info-imagen').fadeOut('fast');
                }
            );

            $('.carrusel-contenedor img').mousemove(function(e) {
                $('#info-imagen').css({
                    top: e.pageY + 15 + 'px',
                    left: e.pageX + 15 + 'px'
                });
            });

            var anchoDesplazamiento = 265;

            $('#btn-der').click(function() {
                $('#carrusel').animate({ scrollLeft: '+=' + anchoDesplazamiento }, 'slow');
            });
            
            $('#btn-izq').click(function() {
                $('#carrusel').animate({ scrollLeft: '-=' + anchoDesplazamiento }, 'slow');
            });
        });
    </script>
</body>
</html>
